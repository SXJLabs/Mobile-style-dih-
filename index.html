<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Simulator</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050b14;
  color:white;
}

/* ================= SXJ SPLASH SCREEN ================= */

#splashScreen{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  z-index:99999;
}

.sxj-logo{
  color:#FFD700;
  font-size:72px;
  font-weight:900;
  letter-spacing:12px;
  opacity:0;
  animation:logoIntro 2.5s ease forwards;
  text-shadow:0 0 20px #FFD700;
}

.wind{
  position:absolute;
  width:300px;
  height:3px;
  background:#FFD700;
  filter:blur(4px);
  left:-350px;
  top:50%;
  animation:windMove 2.5s ease forwards;
}

@keyframes windMove{
  0%{left:-350px;opacity:0;}
  20%{opacity:1;}
  100%{left:120%;opacity:0;}
}

@keyframes logoIntro{
  0%{opacity:0;transform:translateX(-100px);}
  35%{opacity:1;transform:translateX(0);}
  70%{text-shadow:0 0 25px #FFD700;}
  100%{opacity:0;transform:scale(1.1);}
}

/* ================= MAIN SCREENS ================= */

.screen{
  display:none;
  padding:15px;
  min-height:100vh;
  box-sizing:border-box;
}

.active{
  display:block;
}

/* ================= INPUTS (GOLD THEME FIX) ================= */

select,
button{
  width:100%;
  padding:14px;
  margin-top:12px;

  background:#0a0a0a;
  color:white;

  border:2px solid rgba(255,215,0,0.9);

  border-radius:10px;
  font-size:16px;

  box-shadow:
    0 0 8px rgba(255,215,0,0.3),
    inset 0 0 6px rgba(255,215,0,0.15);

  transition:0.25s ease;
  cursor:pointer;
}

/* hover */
button:hover, select:hover{
  transform:scale(1.03);
  box-shadow:
    0 0 15px rgba(255,215,0,0.8),
    0 0 30px rgba(255,215,0,0.4);
}

/* click */
button:active, select:active{
  transform:scale(0.96);
  box-shadow:
    0 0 20px #FFD700,
    inset 0 0 10px rgba(255,215,0,0.3);
}

/* ================= WORLD CUP OVERLAY ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

.wc{
  font-size:28px;
  color:#FFD700;
  animation:pulse 1s infinite;
  text-shadow:0 0 15px #FFD700;
}

@keyframes pulse{
  0%{transform:scale(1);opacity:.6;}
  50%{transform:scale(1.15);opacity:1;}
  100%{transform:scale(1);opacity:.6;}
}

/* ================= RESULT SCREEN ================= */

.score{
  font-size:34px;
  text-align:center;
  color:#FFD700;
  margin-top:10px;
  text-shadow:0 0 15px #FFD700;
}

.stats,
.goalBox{
  margin-top:12px;
  background:#0b1220;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,215,0,0.3);
  box-shadow:0 0 10px rgba(255,215,0,0.15);
}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  font-size:14px;
  color:#ddd;
}

/* ================= MOBILE ================= */

@media (max-width:600px){
  .row{
    flex-direction:column;
    gap:3px;
  }

  .sxj-logo{
    font-size:54px;
  }
}

</style>
</head>

<body>

<!-- SXJ INTRO -->
<div id="splashScreen">
  <div class="wind"></div>
  <div class="sxj-logo">SXJ</div>
</div>

<!-- TEAM SELECT -->
<div id="selectScreen" class="screen">

  <h2>🏆 World Cup 2026 Simulator</h2>

  <select id="teamA"></select>
  <select id="teamB"></select>

  <button onclick="startMatch()">START MATCH</button>

</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay">

  <div class="wc">🏆 FIFA WORLD CUP 2026</div>
  <p id="loadingText">Loading Engine...</p>

</div>

<!-- RESULT -->
<div id="resultScreen" class="screen">

  <div class="score" id="finalScore"></div>
  <div class="stats" id="statsBox"></div>
  <div class="goalBox" id="goalBox"></div>

  <button onclick="goBack()">Back</button>

</div>

<script>

/* ================= (YOUR ORIGINAL JS KEPT SAME) ================= */

let teams = [
"Algeria","Argentina","Australia","Austria","Belgium",
"Bosnia and Herzegovina","Brazil","Cabo Verde","Canada","Colombia",
"Congo DR","Côte d'Ivoire","Croatia","Curaçao","Czechia",
"Ecuador","Egypt","England","France","Germany",
"Ghana","Haiti","IR Iran","Iraq","Japan",
"Jordan","Korea Republic","Mexico","Morocco","Netherlands",
"New Zealand","Norway","Panama","Paraguay","Portugal",
"Qatar","Saudi Arabia","Scotland","Senegal","South Africa",
"Spain","Sweden","Switzerland","Tunisia","Türkiye",
"United States","Uruguay","Uzbekistan"
];

teams.sort((a,b)=>a.localeCompare(b));

const teamA=document.getElementById("teamA");
const teamB=document.getElementById("teamB");

teams.forEach(t=>{
  let a=document.createElement("option");
  let b=document.createElement("option");
  a.text=b.text=t;
  a.value=b.value=t;
  teamA.add(a);
  teamB.add(b);
});

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goBack(){ showScreen("selectScreen"); }

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("splashScreen").style.display="none";
    showScreen("selectScreen");
  },2500);
});

/* dummy match (unchanged logic placeholder) */
function startMatch(){
  document.getElementById("overlay").style.display="flex";

  setTimeout(()=>{
    document.getElementById("overlay").style.display="none";
    document.getElementById("finalScore").innerText="Demo Match Loaded";
    showScreen("resultScreen");
  },2000);
}

</script>

</body>
</html>
