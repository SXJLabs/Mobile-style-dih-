<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Football Match Simulator</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050b14;
  color: white;
}

/* screens */
.screen {
  display: none;
  height: 100vh;
  padding: 20px;
}
.active {
  display: block;
}

/* buttons */
select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #111;
  border: 1px solid #00ffcc;
  color: white;
  border-radius: 8px;
}

/* overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.glow {
  color: #00ffcc;
  font-size: 20px;
}

/* result */
.score {
  font-size: 40px;
  color: #00ffcc;
  text-align: center;
}

.goal {
  color: #aaa;
  text-align: center;
  margin-top: 5px;
}

.btn {
  width: 200px;
  margin: 10px auto;
  display: block;
  padding: 10px;
  background: #00ffcc;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- SELECT SCREEN -->
<div id="selectScreen" class="screen active">
  <h2>⚽ Select Teams</h2>

  <select id="teamA"></select>
  <select id="teamB"></select>

  <button onclick="startMatch()">START MATCH</button>
</div>

<!-- LOADING OVERLAY -->
<div id="overlay" class="overlay">
  <div class="glow" id="loadingText">Starting AI Engine...</div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">

  <div class="score" id="score"></div>
  <div id="goals"></div>

  <button class="btn" onclick="rematch()">🔁 Rematch</button>
  <button class="btn" onclick="goBack()">↩ Go Back</button>

</div>

<script>

// TEAMS
const teams = [
"Argentina","Brazil","France","England","Spain","Germany",
"Italy","Portugal","Netherlands","Belgium","Croatia","USA"
];

// fill dropdowns
let teamA = document.getElementById("teamA");
let teamB = document.getElementById("teamB");

teams.forEach(t=>{
  let a = document.createElement("option");
  let b = document.createElement("option");

  a.text = b.text = t;
  a.value = b.value = t;

  teamA.add(a);
  teamB.add(b);
});

// player pool
const players = [
"Cristiano Ronaldo","Messi","Neymar","Mbappe","Haaland",
"Benzema","Modric","De Bruyne","Vinicius Jr","Saka"
];

let lastTeams = null;

// START MATCH
function startMatch(){

  let a = teamA.value;
  let b = teamB.value;

  lastTeams = {a,b};

  let overlay = document.getElementById("overlay");
  let text = document.getElementById("loadingText");

  overlay.style.display = "flex";

  let steps = [
    "Analyzing Attack...",
    "Analyzing Midfield...",
    "Analyzing Defense...",
    "Calculating Chances...",
    "Final Simulation..."
  ];

  let i = 0;

  let interval = setInterval(()=>{

    text.innerHTML = steps[i];
    i++;

    if(i === steps.length){
      clearInterval(interval);

      setTimeout(()=>{
        overlay.style.display = "none";
        generateResult(a,b);
      }, 400);
    }

  }, 700);
}

// RESULT GENERATION
function generateResult(a,b){

  let scoreA = Math.floor(Math.random()*5);
  let scoreB = Math.floor(Math.random()*5);

  let goals = [];

  function addGoals(team, count){
    for(let i=0;i<count;i++){
      let player = players[Math.floor(Math.random()*players.length)];
      let minute = Math.floor(Math.random()*90)+1;
      goals.push(`${player} (${team}) ${minute}'`);
    }
  }

  addGoals(a, scoreA);
  addGoals(b, scoreB);

  goals.sort((x,y)=>{
    return parseInt(x.match(/\d+/)) - parseInt(y.match(/\d+/));
  });

  document.getElementById("score").innerHTML =
    `${a} ${scoreA} - ${scoreB} ${b}`;

  document.getElementById("goals").innerHTML =
    goals.map(g=>`<div class="goal">⚽ ${g}</div>`).join("");

  showScreen("resultScreen");
}

// REMATCH
function rematch(){
  startMatch();
}

// GO BACK
function goBack(){
  showScreen("selectScreen");
}

// SCREEN SWITCH
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
