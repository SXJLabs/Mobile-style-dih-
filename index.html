<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Video Feed</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  background: #202020;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 10px;
}

.upload-box {
  background: #1f1f1f;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;
}

input, textarea {
  width: 100%;
  margin-top: 5px;
  padding: 8px;
  border: none;
  border-radius: 5px;
}

button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: red;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.post {
  background: #1a1a1a;
  margin-bottom: 15px;
  border-radius: 10px;
  overflow: hidden;
}

.post video {
  width: 100%;
}

.post img {
  width: 100%;
}

.caption {
  padding: 10px;
}
</style>
</head>

<body>

<header>🔥 My Video Feed (YouTube + Insta Style)</header>

<div class="container">

  <div class="upload-box">
    <h3>Upload Video/Post</h3>
    <input type="text" id="title" placeholder="Title">
    <input type="text" id="url" placeholder="Video/Image URL">
    <textarea id="desc" placeholder="Description"></textarea>
    <button onclick="uploadPost()">Upload</button>
  </div>

  <div id="feed"></div>

</div>

<script>

let posts = JSON.parse(localStorage.getItem("posts")) || [];

function uploadPost() {
  let title = document.getElementById("title").value;
  let url = document.getElementById("url").value;
  let desc = document.getElementById("desc").value;

  if(!title || !url) return alert("Fill required fields");

  posts.unshift({ title, url, desc });

  localStorage.setItem("posts", JSON.stringify(posts));

  render();
}

function render() {
  let feed = document.getElementById("feed");
  feed.innerHTML = "";

  posts.forEach(p => {
    let div = document.createElement("div");
    div.className = "post";

    let media = "";

    if(p.url.includes(".mp4")) {
      media = `<video controls src="${p.url}"></video>`;
    } else {
      media = `<img src="${p.url}">`;
    }

    div.innerHTML = `
      ${media}
      <div class="caption">
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
      </div>
    `;

    feed.appendChild(div);
  });
}

render();

</script>

</body>
</html>
