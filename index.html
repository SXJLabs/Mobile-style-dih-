<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SXJ Football Training Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
  background:#0a0a0a;
  color:white;
  overflow-x:hidden;
}

/* SPLASH SCREEN */
#splash{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  animation:fadeOut 2s ease 3s forwards;
}

.logo{
  font-size:60px;
  font-weight:bold;
  letter-spacing:10px;
  color:#00ff88;
  animation:zoom 2s infinite alternate;
}

@keyframes zoom{
  from{transform:scale(1);text-shadow:0 0 10px #00ff88;}
  to{transform:scale(1.3);text-shadow:0 0 40px #00ff88;}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* MAIN */
header{
  text-align:center;
  padding:20px;
  font-size:28px;
  color:#00ff88;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

input{
  width:70%;
  padding:10px;
  border:none;
  outline:none;
  border-radius:5px;
}

button{
  padding:10px 15px;
  background:#00ff88;
  border:none;
  cursor:pointer;
  font-weight:bold;
  margin-left:5px;
  border-radius:5px;
  transition:0.3s;
}

button:hover{
  background:white;
  color:black;
}

.card{
  background:#111;
  margin-top:15px;
  padding:15px;
  border-left:4px solid #00ff88;
  animation:slide 0.5s ease;
}

@keyframes slide{
  from{transform:translateX(-50px);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

.delete{
  float:right;
  background:red;
  color:white;
  border:none;
  padding:5px 10px;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- SXJ SPLASH -->
<div id="splash">
  <div class="logo">SXJ</div>
  <p style="color:white;margin-top:10px;">Loading Beast Mode Training...</p>
</div>

<header>⚽ SXJ FOOTBALL TRAINING MODE</header>

<div class="container">
  <input id="input" placeholder="Enter training day (e.g. Day 1 done: shooting drills)">
  <button onclick="addDay()">Add</button>

  <div id="list"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("training")) || [];

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";
  data.forEach((item,index)=>{
    list.innerHTML += `
      <div class="card">
        ${item}
        <button class="delete" onclick="del(${index})">X</button>
      </div>
    `;
  });
}

function addDay(){
  let input = document.getElementById("input");
  if(input.value.trim() === "") return;

  data.push("🔥 " + input.value);
  localStorage.setItem("training", JSON.stringify(data));
  input.value = "";
  render();
}

function del(i){
  data.splice(i,1);
  localStorage.setItem("training", JSON.stringify(data));
  render();
}

render();
</script>

</body>
</html>
