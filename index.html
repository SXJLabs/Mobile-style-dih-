<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SXJ Career Mode</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0b0b0b;
  color:white;
}

/* ===== SPLASH ===== */
#splash{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 2s ease 3s forwards;
}

.logo{
  font-size:64px;
  color:#00ff88;
  font-weight:bold;
  animation:pulse 1.2s infinite alternate;
  letter-spacing:10px;
}

@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.25); text-shadow:0 0 40px #00ff88;}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* ===== TOP BAR ===== */
header{
  text-align:center;
  padding:14px;
  font-size:18px;
  color:#00ff88;
  font-weight:bold;
}

/* ===== MAIN APP ===== */
.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:12px;
}

/* PLAYER STATS CARD */
.stats{
  background:#111;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  border:1px solid #00ff88;
}

.bar{
  height:8px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}

.fill{
  height:100%;
  background:#00ff88;
  width:0%;
  transition:0.4s;
}

/* INPUT */
.inputBox{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:12px;
}

input{
  padding:14px;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:16px;
}

button{
  padding:14px;
  border:none;
  border-radius:10px;
  background:#00ff88;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(0.97);
}

/* CARDS */
.card{
  background:#151515;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border-left:4px solid #00ff88;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.del{
  background:red;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:6px;
}

/* MOBILE PERFECT */
@media(max-width:600px){
  .container{
    padding:10px;
  }

  header{
    font-size:16px;
  }

  button, input{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- SXJ SPLASH -->
<div id="splash">
  <div class="logo">SXJ</div>
  <p style="color:white;margin-top:10px;">Entering Career Mode...</p>
</div>

<header>⚽ SXJ FOOTBALL CAREER MODE</header>

<div class="container">

  <!-- PLAYER LEVEL -->
  <div class="stats">
    <div>🔥 Level: <span id="level">1</span></div>
    <div>⭐ XP: <span id="xp">0</span>/100</div>
    <div class="bar"><div class="fill" id="bar"></div></div>
  </div>

  <!-- INPUT -->
  <div class="inputBox">
    <input id="input" placeholder="Write training (e.g. Day 1 shooting drills)">
    <button onclick="addTraining()">ADD TRAINING</button>
  </div>

  <!-- LIST -->
  <div id="list"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("sxj_data")) || [];
let xp = parseInt(localStorage.getItem("xp")) || 0;
let level = parseInt(localStorage.getItem("level")) || 1;

function updateStats(){
  document.getElementById("xp").innerText = xp;
  document.getElementById("level").innerText = level;

  let percent = xp % 100;
  document.getElementById("bar").style.width = percent + "%";
}

function addTraining(){
  let input = document.getElementById("input");
  if(input.value.trim() === "") return;

  data.push("⚽ " + input.value);
  localStorage.setItem("sxj_data", JSON.stringify(data));

  // XP SYSTEM (beast mode)
  xp += 20;

  if(xp >= level * 100){
    level++;
  }

  localStorage.setItem("xp", xp);
  localStorage.setItem("level", level);

  input.value = "";
  render();
  updateStats();
}

function removeItem(i){
  data.splice(i,1);
  localStorage.setItem("sxj_data", JSON.stringify(data));
  render();
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach((t,i)=>{
    list.innerHTML += `
      <div class="card">
        <div>${t}</div>
        <button class="del" onclick="removeItem(${i})">X</button>
      </div>
    `;
  });
}

updateStats();
render();

</script>

</body>
</html>
