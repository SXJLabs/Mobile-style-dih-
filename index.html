<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football AI Match Simulator</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #06121f, #000);
  color: white;
  overflow: hidden;
}

.screen {
  display: none;
  height: 100vh;
  padding: 20px;
}

.active {
  display: block;
}

/* Selection */
select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #111;
  border: 1px solid #00ffcc;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* Loading animation */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.glow {
  color: #00ffcc;
  font-size: 20px;
  text-shadow: 0 0 10px #00ffcc;
}

/* Result */
.result-box {
  text-align: center;
  margin-top: 80px;
}

.score {
  font-size: 40px;
  color: #00ffcc;
}

.goal {
  margin-top: 10px;
  color: #aaa;
}

.btn {
  margin-top: 10px;
  padding: 10px;
  background: #00ffcc;
  border: none;
  width: 200px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- SELECTION SCREEN -->
<div id="selectScreen" class="screen active">

  <h2>⚽ Select Teams</h2>

  <select id="teamA"></select>
  <select id="teamB"></select>

  <button onclick="startMatch()">START MATCH</button>
</div>

<!-- LOADING OVERLAY -->
<div id="overlay" class="overlay">
  <div class="glow" id="loadingText">Initializing AI Engine...</div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">

  <div class="result-box">
    <div class="score" id="score"></div>
    <div id="goals"></div>

    <button class="btn" onclick="rematch()">🔁 Rematch</button>
    <button class="btn" onclick="goBack()">↩ Go Back</button>
  </div>

</div>

<script>

// TEAMS
const teams = [
"Argentina","Brazil","France","England","Spain","Germany",
"Italy","Portugal","Netherlands","Belgium","Croatia","USA"
];

let teamA = document.getElementById("teamA");
let teamB = document.getElementById("teamB");

teams.forEach(t=>{
  let a = document.createElement("option");
  a.text = t;
  a.value = t;
  teamA.add(a);

  let b = document.createElement("option");
  b.text = t;
  b.value = t;
  teamB.add(b);
});

// PLAYER NAMES (fake pool for goals)
const players = [
"Cristiano Ronaldo","Lionel Messi","Neymar","Mbappé","Haaland",
"Benzema","Modrić","De Bruyne","Vinicius Jr","Saka",
"Foden","Griezmann"
];

let lastMatch = null;

// START MATCH
function startMatch(){
  let a = teamA.value;
  let b = teamB.value;

  let overlay = document.getElementById("overlay");
  let text = document.getElementById("loadingText");

  overlay.style.display = "flex";

  let steps = [
    "Analyzing Attack...",
    "Analyzing Midfield...",
    "Breaking Defensive Lines...",
    "Calculating Expected Goals...",
    "Finalizing Simulation..."
  ];

  let i = 0;

  let interval = setInterval(()=>{
    text.innerHTML = steps[i];
    i++;

    if(i === steps.length){
      clearInterval(interval);

      setTimeout(()=>{
        overlay.style.display = "none";
        generateResult(a,b);
      }, 500);
    }

  }, 800);
}

// GENERATE MATCH RESULT
function generateResult(a,b){

  let scoreA = Math.floor(Math.random()*5);
  let scoreB = Math.floor(Math.random()*5);

  let goals = [];

  function genGoals(team, count){
    for(let i=0;i<count;i++){
      let player = players[Math.floor(Math.random()*players.length)];
      let minute = Math.floor(Math.random()*90)+1;
      goals.push(`${player} (${team}) ${minute}'`);
    }
  }

  genGoals(a, scoreA);
  genGoals(b, scoreB);

  goals.sort((x,y)=>{
    return parseInt(x.match(/\d+/)) - parseInt(y.match(/\d+/));
  });

  document.getElementById("score").innerHTML =
    `${a} ${scoreA} - ${scoreB} ${b}`;

  document.getElementById("goals").innerHTML =
    goals.map(g=>`<div class="goal">⚽ ${g}</div>`).join("");

  lastMatch = {a,b};

  showScreen("resultScreen");
}

// REMATCH
function rematch(){
  startMatch();
}

// GO BACK
function goBack(){
  showScreen("selectScreen");
}

// SCREEN SWITCH
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
