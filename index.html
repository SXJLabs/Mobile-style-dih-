<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SXJ Training App</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0a0a0a;
  color:white;
}

/* SPLASH SCREEN */
#splash{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  animation:fadeOut 2s ease 3s forwards;
}

.logo{
  font-size:60px;
  font-weight:bold;
  color:#00ff88;
  letter-spacing:8px;
  animation:zoom 1.5s infinite alternate;
}

@keyframes zoom{
  from{transform:scale(1);}
  to{transform:scale(1.2); text-shadow:0 0 30px #00ff88;}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* HEADER */
header{
  text-align:center;
  padding:15px;
  font-size:22px;
  color:#00ff88;
  font-weight:bold;
}

/* CONTAINER */
.container{
  width:100%;
  max-width:800px;
  margin:auto;
  padding:15px;
}

/* INPUT AREA */
.input-box{
  display:flex;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

input{
  flex:1;
  padding:12px;
  border:none;
  outline:none;
  border-radius:8px;
  font-size:16px;
}

button{
  padding:12px 15px;
  background:#00ff88;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  background:white;
  color:black;
}

/* TRAINING CARD */
.card{
  background:#111;
  padding:12px;
  margin-top:10px;
  border-left:4px solid #00ff88;
  border-radius:6px;
  animation:slide 0.3s ease;
  display:flex;
  justify-content:space-between;
  align-items:center;
  word-break:break-word;
}

@keyframes slide{
  from{transform:translateY(10px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.del{
  background:red;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:5px;
  cursor:pointer;
}

/* MOBILE OPTIMIZATION */
@media (max-width:600px){
  .logo{font-size:40px;}
  header{font-size:18px;}

  input{
    width:100%;
  }

  button{
    width:100%;
  }

  .input-box{
    flex-direction:column;
  }

  .card{
    font-size:14px;
  }
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logo">SXJ</div>
  <p style="color:white;margin-top:10px;">Loading Training Mode...</p>
</div>

<header>⚽ SXJ FOOTBALL TRAINING TRACKER</header>

<div class="container">

  <div class="input-box">
    <input id="input" placeholder="Enter training (Day 1, shooting, dribbling...)">
    <button onclick="add()">ADD</button>
  </div>

  <div id="list"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("sxj_training")) || [];

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach((item,i)=>{
    list.innerHTML += `
      <div class="card">
        <div>🔥 ${item}</div>
        <button class="del" onclick="removeItem(${i})">X</button>
      </div>
    `;
  });
}

function add(){
  let input = document.getElementById("input");
  if(input.value.trim() === "") return;

  data.push(input.value);
  localStorage.setItem("sxj_training", JSON.stringify(data));
  input.value = "";
  render();
}

function removeItem(i){
  data.splice(i,1);
  localStorage.setItem("sxj_training", JSON.stringify(data));
  render();
}

render();
</script>

</body>
</html>
