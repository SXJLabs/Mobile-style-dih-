<script>

// WORLD CUP STYLE TEAM DATABASE (STRUCTURED LIKE REAL FIFA SYSTEM)
const teams = [
  // AFC
  "Australia","Iran","Japan","Jordan","Qatar","Saudi Arabia","South Korea","Uzbekistan",

  // CAF
  "Algeria","Cape Verde","Egypt","Ghana","Morocco","Nigeria","Senegal","South Africa","Tunisia","DR Congo",

  // CONCACAF
  "Canada","Costa Rica","Cuba","Haiti","Mexico","Panama","United States",

  // CONMEBOL
  "Argentina","Bolivia","Brazil","Chile","Colombia","Ecuador","Paraguay","Peru","Uruguay","Venezuela",

  // OFC
  "New Zealand","New Caledonia",

  // UEFA
  "Austria","Belgium","Croatia","Czechia","Denmark","England","France","Germany",
  "Hungary","Italy","Netherlands","Norway","Poland","Portugal","Scotland","Serbia",
  "Spain","Sweden","Switzerland","Turkey","Ukraine","Wales","Bosnia and Herzegovina"
];

// SORT ALPHABETICALLY (A → Z like you asked)
teams.sort();

// FILL DROPDOWNS
let teamA = document.getElementById("teamA");
let teamB = document.getElementById("teamB");

teams.forEach(t => {
  let opt1 = document.createElement("option");
  opt1.text = t;
  opt1.value = t;
  teamA.appendChild(opt1);

  let opt2 = document.createElement("option");
  opt2.text = t;
  opt2.value = t;
  teamB.appendChild(opt2);
});

</script>
