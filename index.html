<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup AI Command Center</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0b1b2b, #000);
  color: white;
}

/* Layout */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 100vh;
}

/* Panels */
.panel {
  padding: 20px;
  border-right: 1px solid rgba(255,255,255,0.1);
}

h1 {
  color: #00ffcc;
}

select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #111;
  border: 1px solid #00ffcc;
  color: white;
  border-radius: 8px;
}

/* Center animation */
.center {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.glow {
  font-size: 20px;
  color: #00ffcc;
  text-shadow: 0 0 10px #00ffcc;
}

/* Stats bars */
.bar {
  height: 10px;
  background: #222;
  border-radius: 5px;
  margin-bottom: 10px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: linear-gradient(90deg, #00ffcc, #0066ff);
}
</style>

</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="panel">
    <h1>⚽ TEAM SELECT</h1>

    <select id="teamA">
      <option>Argentina</option>
      <option>Brazil</option>
      <option>Spain</option>
      <option>France</option>
      <option>Germany</option>
    </select>

    <select id="teamB">
      <option>Spain</option>
      <option>France</option>
      <option>Brazil</option>
      <option>Argentina</option>
      <option>England</option>
    </select>

    <button onclick="simulate()">RUN AI SIMULATION</button>

    <h3>AI STATUS</h3>
    <div id="status">Idle</div>
  </div>

  <!-- CENTER -->
  <div class="panel center">
    <div class="glow" id="result">
      WAITING FOR MATCH DATA...
    </div>

    <div id="score"></div>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <h1>📊 MATCH ANALYSIS</h1>

    <p>Attack</p>
    <div class="bar"><div class="fill" id="a1"></div></div>

    <p>Defense</p>
    <div class="bar"><div class="fill" id="a2"></div></div>

    <p>Form</p>
    <div class="bar"><div class="fill" id="a3"></div></div>
  </div>

</div>

<script>

function simulate() {
  let a = document.getElementById("teamA").value;
  let b = document.getElementById("teamB").value;

  let status = document.getElementById("status");
  let result = document.getElementById("result");

  status.innerHTML = "Analyzing Tactical Data...";

  let steps = [
    "Checking Form...",
    "Analyzing Attack Strength...",
    "Running AI Prediction...",
    "Finalizing Result..."
  ];

  let i = 0;

  let interval = setInterval(() => {
    status.innerHTML = steps[i];
    i++;

    if(i === steps.length) {
      clearInterval(interval);

      let scoreA = Math.floor(Math.random() * 4);
      let scoreB = Math.floor(Math.random() * 4);

      result.innerHTML = `${a} ${scoreA} - ${scoreB} ${b}`;

      document.getElementById("a1").style.width = Math.random()*100 + "%";
      document.getElementById("a2").style.width = Math.random()*100 + "%";
      document.getElementById("a3").style.width = Math.random()*100 + "%";
    }

  }, 1000);
}

</script>

</body>
</html>
